<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrix Visualizer</title>
    <link data-trunk rel="rust" data-bin="matrix-visualizer">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;

        height: 100%;

    <canvas id="canvas" tabindex="0" aria-label="Matrix Visualizer"></canvas>
